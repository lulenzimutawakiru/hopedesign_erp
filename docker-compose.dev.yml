# ---- LOCAL DEVELOPMENT ONLY - never deploy this file to a server. ----------
# Deliberately NOT named docker-compose.yml. Compose auto-discovers
# compose.yaml, compose.yml, docker-compose.yaml and docker-compose.yml, so on
# a production host a bare `docker compose up -d` would pick this file up and
# start a second postgres with the well-known password below, unrelated to the
# running stack. The production stack is docker-compose.prod.yml.
# Start local dev services with:
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: hopedesign_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hopedesign
      POSTGRES_PASSWORD: hopedesign_dev
      POSTGRES_DB: hopedesign_erp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopedesign -d hopedesign_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hopedesign_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # Redis is unused by the current codebase; localhost-only binding + optional
    # password (set REDIS_PASSWORD) so the service is not an unauthenticated
    # network listener if it is ever activated.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
