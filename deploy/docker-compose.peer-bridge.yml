# ---- Peer-node standby data bridge (added 2026-09-26) ----------------------
# Applied on the SECOND VPS together with docker-compose.prod.yml,
# deploy/docker-compose.peer.yml and deploy/docker-compose.peer-replica.yml:
#
#   docker compose -f docker-compose.prod.yml \
#                  -f deploy/docker-compose.peer.yml \
#                  -f deploy/docker-compose.peer-replica.yml \
#                  -f deploy/docker-compose.peer-bridge.yml \
#                  --env-file .env.production up -d
#
# Why this exists: deploy/docker-compose.peer-db.yml (on the primary) publishes
# the primary's postgres + redis on 10.77.0.1:9101/9102 so the PEER can borrow
# them. This file is the mirror image, and it exists for one reason only - the
# day the roles swap. After deploy/failover-agent.sh promotes this node's
# data-dr standby, the DEMOTED primary needs to reach the peer's data exactly
# the way the peer reached the primary's: same ports, same direction, reversed.
# Without these listeners the demoted primary would still be pointing at its own
# now-stale postgres and the two machines would silently diverge.
#
#   pgbridge-local    10.77.0.2:9101 -> data-dr:5432
#   redisbridge-local 10.77.0.2:9102 -> redis:6379
#   caddy             10.77.0.2:8080 = this node's frontend door
#                     10.77.0.2:8081 = this node's internal API door
#
# Both are bound to the WireGuard address, so they are invisible to the public
# internet - the packets arrive from the other VPS over wg0 and nothing else can
# reach them. Ports 9101/9102 are the same numbers the primary uses, so the
# reversing rule is "swap the IP, keep the port" and one compose overlay can be
# reused on either side.
#
# pgbridge-local targets data-dr, NOT postgres, on purpose. This node's own
# `postgres` service still carries a stale dataset from before the standby was
# seeded; handing that to the demoted primary would quietly serve months-old
# rows. data-dr is the copy that has been streaming WAL the whole time.
#
# These listeners are inert until the roles actually swap: in steady state
# nothing connects to them. They are left running on purpose so the reversal
# does not depend on a compose-up succeeding during the incident.
#
# The third service here is Caddy's two mesh doors. Both are declared in THIS
# file, because this file is the only place the peer's cross-node listeners are
# owned in the repository:
#
#   :8080  the FRONTEND door. This node's `:8080` block (bottom of
#          deploy/Caddyfile) answers with THIS node's local web replicas, and
#          publishing it on the tunnel address is what makes the primary's
#          public pool hold this node at all - the primary's webpeer.caddy
#          points at 10.77.0.2:8080. Its mirror is the primary publishing its
#          own frontend as 10.77.0.1:9103.
#   :8081  the INTERNAL API door. This node's `:8081` block answers with THIS
#          node's local api-a/api-b, and publishing it is what lets the other
#          machine retry here when its own active colour dies - the mirror of
#          the primary publishing its own `:8081` as 10.77.0.1:9104.
#
# The two doors used to be split. The API door was declared here; the frontend
# door was added by hand to docker-compose.prod.yml ON THE PEER ALONE. That
# hand-edit was invisible to the repository, so any repo-driven redeploy of the
# peer restored prod.yml, removed the door, and silently dropped the primary's
# pool member - Caddy stayed healthy and only the pool membership was gone, so
# no health check could see it. Both doors live here now, on purpose: this file
# is on every peer compose invocation and prod.yml is not.
#
# Ports are host-side only and bound to the WireGuard address, so they map the
# container port to itself on the tunnel and nothing but wg0 can reach either.
#
# Portable: on the data primary this file is not used at all.
services:
  pgbridge-local:
    image: alpine/socat:latest
    container_name: hopedesign-erp-pgbridge-local
    restart: unless-stopped
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:data-dr:5432"]
    ports:
      - "10.77.0.2:9101:5432"
    # NO depends_on: data-dr here, deliberately. data-dr is defined only in
    # deploy/docker-compose.peer-replica.yml, which every failover file-set drops
    # on purpose - so a depends_on pointing at it makes `docker compose up` fail
    # with "service data-dr is not defined", on the one code path that runs
    # during an outage. socat is restart: unless-stopped and reconnects by itself
    # the moment data-dr starts listening, and nothing connects to this bridge in
    # steady state, so the ordering buys nothing and costs a hard failure.
    networks:
      - internal

  redisbridge-local:
    image: alpine/socat:latest
    container_name: hopedesign-erp-redisbridge-local
    restart: unless-stopped
    command: ["TCP-LISTEN:6379,fork,reuseaddr", "TCP:redis:6379"]
    ports:
      - "10.77.0.2:9102:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  caddy:
    ports:
      # Both doors this node owes the mesh, and the only place either is
      # published. 10.77.0.2:8080 is the line the primary's public pool depends
      # on - do not move it back into docker-compose.prod.yml (see the header
      # for what that cost). 10.77.0.2:8081 is the retry target the primary's
      # active.caddy falls through to.
      #
      # Compose CONCATENATES ports across overlays rather than overriding them,
      # so each door must be declared in EXACTLY ONE file: a second copy of
      # either line makes `docker compose up` fail with "port is already
      # allocated", which on this node is the outage path.
      - "10.77.0.2:8080:8080"
      - "10.77.0.2:8081:8081"
