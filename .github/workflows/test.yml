name: HOPE DESIGN ERP CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://hopedesign:hopedesign_dev@localhost:5432/hopedesign_erp

    services:

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hopedesign
          POSTGRES_PASSWORD: hopedesign_dev
          POSTGRES_DB: hopedesign_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hopedesign -d hopedesign_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Build database package
        run: npm run build -w packages/db


      - name: Run database migrations
        run: npm run db:migrate


      - name: Seed database
        run: npm run db:seed


      - name: Run API tests
        run: npm run test -w apps/api


      - name: Run Web tests
        run: npm run test -w apps/web
