name: HOPE DESIGN ERP Security

on:
  push:
    branches:
      - main

jobs:

  security:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Gate 2 - dependency scan. The deployed (production) dependency tree must
      # be free of Critical/High advisories; a finding here blocks the build.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Dev-only toolchain advisories (vite, vitest and their transitive deps) are
      # reported but do not block: they are not part of any deployed image, and the
      # published fixes are breaking majors (vite@8, vitest@5).
      - name: Full dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Formally risk-accepted production findings, reviewed 2026-09-12:
      #   * express@4.22.2 -> qs@6.15.3 (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g)
      #     Moderate DoS in query-string parsing. express@4 pins qs to ~6.15.1 and
      #     4.22.2 is the last 4.x release, so the patch is only reachable through the
      #     express@5 major upgrade (separate, planned migration).
      #   * exceljs@4.4.0 -> uuid@8.3.2 (GHSA-w5hq-g745-h8pq)
      #     Moderate, and only reachable when a caller passes a `buf` to uuid v3/v5/v6.
      #     exceljs never does. The published fix path is a downgrade to exceljs@3.4.0,
      #     which we deliberately do not take.

      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v2
