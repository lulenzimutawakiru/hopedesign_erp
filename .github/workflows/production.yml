name: HOPE DESIGN ERP Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to ERP Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # AccuWeb moves SSH off 22; this host answers on 2978.
          port: 2978
          script_stop: true
          # A blue/green rollout builds two API images plus the SPA, so the
          # action default of 10m can elapse mid-build and kill a live flip.
          command_timeout: 30m
          script: |
            cd /opt/hopedesign_erp
            # Canonical rollout: backup, fast-forward to origin/main, build the
            # idle API color, recreate web, then atomically flip Caddy.
            bash deploy/zero-downtime-deploy.sh
