services:
  postgres:
    image: postgres:16-alpine
    container_name: hopedesign_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hopedesign
      POSTGRES_PASSWORD: hopedesign_dev
      POSTGRES_DB: hopedesign_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopedesign -d hopedesign_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hopedesign_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
