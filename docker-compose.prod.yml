# Production stack for an AccuWeb Linux VPS (Ubuntu/Debian, Docker CE).
#
#   cp deploy/env.production.example .env.production
#   node deploy/generate-env.mjs --domain hopedesign.jorlentech.com --email admin@hopedesign.jorlentech.com
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Blue/green API rollout - two always-running API colors behind Caddy:
#   api-a   the default active color
#   api-b   the other color
# Caddy routes /api only to the ACTIVE color. deploy/zero-downtime-deploy.sh
# rebuilds the idle color, waits for it to become Docker-healthy, then flips
# Caddy with an atomic `caddy reload`. One color is always serving, so a
# rollout never drops a request.
#
# Public ports: 80 + 443 only. Postgres stays on the compose network.

name: hopedesign-erp

x-logging: &default-log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
    target: api
  restart: unless-stopped
  # Boot migrations are advisory-locked in the API, so both colors may start
  # against the same database without racing DDL. Only one color receives
  # traffic at a time (see deploy/README.md).
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  env_file:
    - .env.production
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "4000"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_SSL: "false"
    NODE_OPTIONS: "--max-old-space-size=768"
    DATABASE_URL: postgres://${POSTGRES_USER:-hopedesign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hopedesign}
    STORAGE_ROOT: /data/uploads
    # BullMQ broker for the background worker (apps/api/src/services/queue/).
    # Built here from REDIS_PASSWORD rather than read from .env.production so the
    # password stays single-sourced. It is set on the API colors AND the worker
    # deliberately: the API turns its in-process fallback timers OFF as soon as
    # it sees a broker, so if only one of the two saw this the scheduled work
    # would either stop entirely or run twice.
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}@redis:6379/0
  mem_limit: 1024m
  mem_reservation: 256m
  volumes:
    - uploads:/data/uploads
  security_opt:
    - no-new-privileges:true
  healthcheck: &api-health
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 10s
    timeout: 4s
    start_period: 120s
    retries: 12
  logging: *default-log
  networks:
    - internal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopedesign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-hopedesign}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_autovacuum_min_duration=250
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopedesign} -d ${POSTGRES_DB:-hopedesign}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - internal

  # BullMQ broker for the background worker.
  #
  # Private to the compose network - no host port - so only the API colors and
  # the worker can reach it. It is a job queue and not a cache: BullMQ job
  # payloads must never be evicted, so `maxmemory-policy noeviction` makes Redis
  # reject writes and fail loudly if it ever fills rather than silently dropping
  # a scheduled occurrence. Append-only persistence carries the schedule and any
  # queued job across a restart; the worker additionally re-registers every job
  # scheduler on boot, so the schedule is self-healing even from a cold start.
  #
  # The password also appears in the container's argv (`docker inspect`), which
  # is accepted: anyone who can read that on the host can already read
  # .env.production. It is still worth having, because it is the only thing
  # standing between a rogue container on this network and the job queue.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck needs no `-a` argument
      # and the password never reaches the healthcheck's process table.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - internal

  api-a:
    <<: *api
    container_name: hopedesign-erp-api-a

  api-b:
    <<: *api
    container_name: hopedesign-erp-api-b

  # Background worker: the BullMQ consumer that runs every periodic task - report
  # schedules, cron fan-out, the Hikvision event drain, EFRIS fiscalization and
  # notification delivery. It shares the API's image and environment but runs the
  # consumer entrypoint instead of the HTTP server, and publishes no ports.
  #
  # Deliberately a single instance. The box has one vCPU and every tick is short;
  # adding workers would multiply concurrent database work rather than spread it,
  # because the handlers coalesce and each task is additionally fenced by a
  # Postgres advisory lock. If this container dies, scheduled work stops - the
  # API colors no longer run those timers themselves - so deploy/stack-watchdog.sh
  # reconciles it alongside postgres and web.
  worker:
    <<: *api
    container_name: hopedesign-erp-worker-1
    # The image's default CMD runs the boot entrypoint, which waits for Postgres
    # and migrates the database as the owner role. The API colors already own
    # migrations (advisory-locked, so they cannot race), so the worker skips all
    # of that and starts consuming immediately.
    command: ["node", "apps/api/dist/worker.js"]
    # The inherited API healthcheck probes :4000/api/health, which this process
    # does not serve. The worker exposes its own liveness endpoint on :4100,
    # which reports 503 unless it holds a ready Redis connection AND is actively
    # consuming - so a wedged consumer is restarted, not just a dead process.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    # Only short periodic ticks run here; the heavy lifting is in Postgres.
    mem_limit: 512m
    mem_reservation: 128m

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    stop_grace_period: 20s
    # Stateless static SPA. Runs as multiple replicas so rebuilding or restarting
    # one replica never interrupts the frontend: Caddy balances the `web` alias
    # with lb_policy least_conn + active health checks, and Docker's embedded DNS
    # returns every replica IP for that alias. The image ships a HEALTHCHECK, so
    # caddy's `depends_on: web: service_healthy` gate is unaffected.
    deploy:
      replicas: 2
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
      web:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production (e.g. hopedesign.jorlentech.com or :80)}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      # Optional public hostname for the availability monitor UI. Empty (the
      # default) keeps it reachable only through an SSH tunnel on
      # 127.0.0.1:3001. When set, Caddy terminates TLS in front of it and
      # proxies to uptime-kuma:3001 by name over the compose network - no
      # host port is published either way.
      KUMA_DOMAIN: ${KUMA_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      # deploy/caddy-live/active.caddy (gitignored) is rewritten at deploy time
      # and flips Caddy between api-a and api-b with `caddy reload`.
      - ./deploy/caddy-live:/etc/caddy/live
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *default-log
    networks:
      - internal

  # Availability monitor. Deliberately its own image and container rather than a
  # sidecar on the API: it must stay up when the API is the thing that is broken.
  #
  # The UI port is bound to 127.0.0.1 ONLY. It previously ran as a bare
  # `docker run` container publishing 3001 on 0.0.0.0 over plain HTTP, which put
  # an admin login on the public internet in cleartext. Loopback keeps it
  # reachable through an SSH tunnel with nothing exposed:
  #   ssh -p 2978 -L 3001:127.0.0.1:3001 root@<vps>
  #
  # For browser access instead, set KUMA_DOMAIN and Caddy terminates TLS in
  # front of it (deploy/caddy-entrypoint.sh). That path needs no host port at
  # all - Caddy reaches this container by name over the compose network.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: hopedesign-erp-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - internal

volumes:
  pgdata:
  uploads:
  redisdata:
  caddy_data:
  caddy_config:
  # Pinned by explicit name so compose adopts the volume the monitor already
  # used when it ran as a bare `docker run` container. Without `name:` compose
  # would create a project-prefixed volume, and the existing admin account and
  # settings would appear to silently vanish.
  #
  # Compose then warns on every up that the volume was not created by Docker
  # Compose. That warning is expected and harmless here; external: true would
  # silence it but would also fail a fresh bootstrap, where the volume does not
  # exist yet.
  uptime-kuma:
    name: uptime-kuma

networks:
  internal:
    driver: bridge