# Production stack for an AccuWeb Linux VPS (Ubuntu/Debian, Docker CE).
# Usage:
#   cp deploy/env.production.example .env.production
#   node deploy/generate-env.mjs --domain hopedesign.jorlentech.com --email admin@hopedesign.jorlentech.com
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Zero-downtime rollout (two stateless API replicas behind Caddy):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --scale api=2
#   sh deploy/zero-downtime-deploy.sh   # recommended: backup -> pull -> build -> rolling update
#
# Public ports: 80 + 443 only. Postgres is not published.

name: hopedesign-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hopedesign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-hopedesign_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_autovacuum_min_duration=250
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hopedesign} -d ${POSTGRES_DB:-hopedesign_erp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: &default-log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    # Two replicas run by default (`--scale api=2`). Both are stateless, share
    # the uploads volume, and are load-balanced by Caddy with active health
    # checks, so a replica can be replaced without dropping requests.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      NODE_OPTIONS: "--max-old-space-size=768"
      DATABASE_URL: postgres://${POSTGRES_USER:-hopedesign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hopedesign_erp}
      STORAGE_ROOT: /data/uploads
    mem_limit: 1024m
    mem_reservation: 256m
    volumes:
      - uploads:/data/uploads
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      start_period: 180s
      retries: 8
    logging: *default-log
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - internal

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production (e.g. hopedesign.jorlentech.com or :80)}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging: *default-log
    networks:
      - internal

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
